{{- if .Values.clusterManager.create }}
apiVersion: operator.open-cluster-management.io/v1
kind: ClusterManager
metadata:
  name: cluster-manager
spec:
  registrationImagePullSpec: "{{ template "registrationImage" . }}"
  workImagePullSpec: "{{ template "workImage" . }}"
  placementImagePullSpec: "{{ template "placementImage" . }}"
  addOnManagerImagePullSpec: "{{ template "addOnManagerImage" . }}"
  deployOption:
    mode: {{ .Values.clusterManager.mode }}
    {{- if eq .Values.clusterManager.mode "Hosted" }}
    hosted:
      registrationWebhookConfiguration:
        address: {{ required "clusterManager.hosted.registrationWebhookConfiguration.address is required in Hosted mode" .Values.clusterManager.hosted.registrationWebhookConfiguration.address | quote }}
        port: {{ .Values.clusterManager.hosted.registrationWebhookConfiguration.port }}
        {{- with .Values.clusterManager.hosted.registrationWebhookConfiguration.bindConfiguration }}
        bindConfiguration:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      workWebhookConfiguration:
        address: {{ required "clusterManager.hosted.workWebhookConfiguration.address is required in Hosted mode" .Values.clusterManager.hosted.workWebhookConfiguration.address | quote }}
        port: {{ .Values.clusterManager.hosted.workWebhookConfiguration.port }}
        {{- with .Values.clusterManager.hosted.workWebhookConfiguration.bindConfiguration }}
        bindConfiguration:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- end }}
  {{- with .Values.clusterManager.resourceRequirement }}
  resourceRequirement:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  registrationConfiguration:
    {{- if or .Values.createBootstrapToken .Values.createBootstrapSA }}
    autoApproveUsers:
      {{- if .Values.createBootstrapToken }}
      # token-id is fixed in bootstrap-token-ocmhub secret
      - system:bootstrap:bootstrap-token-ocmhub
      {{- end }}
      {{- if .Values.createBootstrapSA }}
      - system:serviceaccount:{{ .Release.Namespace }}:agent-registration-bootstrap
      {{- end }}
    {{- end }}
    {{- with .Values.clusterManager.registrationConfiguration.featureGates }}
    featureGates:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.clusterManager.registrationConfiguration.registrationDrivers }}
    registrationDrivers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.clusterManager.workConfiguration }}
  workConfiguration:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.clusterManager.addOnManagerConfiguration }}
  addOnManagerConfiguration:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.clusterManager.placementConfiguration }}
  placementConfiguration:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.clusterManager.serverConfiguration }}
  serverConfiguration:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
