# Copyright Contributors to the Open Cluster Management project

version: "2"

run:
  # default concurrency is an available CPU number
  concurrency: 10
  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 5m
  # The mode used to evaluate relative paths.
  # It's used by exclusions, Go plugins, and some linters.
  relative-path-mode: cfg
  # # Include test files or not.
  # tests: false

formatters:
  enable:
    - gci
    - gofmt
    # - gofumpt
    - goimports
    # - golines
    # - swaggo
  settings:
    gofmt:
      # simplify code: gofmt with `-s` option, true by default
      simplify: true
    goimports:
      # put imports beginning with prefix after 3rd-party packages;
      # it's a comma-separated list of prefixes
      local-prefixes:
        - open-cluster-management.io/ocm/
    gci:
      # Section configuration to compare against.
      # Section names are case-insensitive and may contain parameters in ().
      # The default order of sections is `standard > default > custom > blank > dot`,
      # If `custom-order` is `true`, it follows the order of `sections` option.
      # Default: ["standard", "default"]
      sections:
        - standard # Standard section: captures all standard packages.
        - default # Default section: contains all imports that could not be matched to another section type.
        - prefix(open-cluster-management.io) # Custom section: groups all imports with the specified Prefix.
        # - prefix(open-cluster-management.io/ocm)
        # - blank # Blank section: contains all blank imports. This section is not present unless explicitly enabled.
        # - dot # Dot section: contains all dot imports. This section is not present unless explicitly enabled.
        # - alias # Alias section: contains all alias imports. This section is not present unless explicitly enabled.
        - localmodule # Local module section: contains all local packages. This section is not present unless explicitly enabled.
      # Enable custom order of sections.
      # If `true`, make the section order the same as the order of `sections`.
      # Default: false
      custom-order: true

linters:
  # Explicitly disable all default linters
  default: standard # standard | all | none | fast
  # Enable specific linters
  # enable:
  #   - unused
  #   - errcheck
  #   - goconst
  #   - gocritic
  #   - gosec
  #   - staticcheck
  #   - govet
  #   - ineffassign
  #   - lll
  #   - misspell
  #   - unconvert
  #   - revive
  # disable:
  #   - gocyclo
  #   - bodyclose
  #   - depguard
  #   - dogsled
  #   - dupl
  #   - funlen
  #   - gochecknoglobals
  #   - gochecknoinits
  #   - gocognit
  #   - godox
  #   - nakedret
  #   - prealloc
  #   - whitespace
  exclusions:
    # Mode of the generated files analysis.
    generated: strict # strict | lax | disable
    # Log a warning if an exclusion rule is unused.
    warn-unused: true
    # Predefined exclusion rules
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - ".*_test\\.go"
    # # Excluding configuration per-path, per-linter, per-text and per-source.
    # rules:
    #   # Exclude some linters from running on tests files.
    #   - path: ".*_test\\.go"
    #     linters:
    #       - gocyclo
    #       - errcheck
    #       - dupl
    #       - gosec
    #       - staticcheck
    #       - revive
    #       - lll
    # Remove these rules as the corresponding existing findings are fixed.
    # Identical source and diagnostics in the same file are also excluded.
    rules:
      - path: '^pkg/addon/webhook/v1alpha1/webhook\.go$'
        linters: [staticcheck]
        text: '^ST1016: methods on the same type should have the same receiver name \(seen 2x "r", 3x "in"\)$'
        source: '^[[:space:]]*func \(in \*ClusterManagementAddOn\) DeepCopy\(\) \*ClusterManagementAddOn \{[[:space:]]*$'
      - path: '^pkg/addon/webhook/v1alpha1/webhook\.go$'
        linters: [staticcheck]
        text: '^ST1016: methods on the same type should have the same receiver name \(seen 2x "r", 3x "in"\)$'
        source: '^[[:space:]]*func \(in \*ManagedClusterAddOn\) DeepCopy\(\) \*ManagedClusterAddOn \{[[:space:]]*$'
      - path: '^pkg/addon/webhook/v1beta1/clustermanagementaddon_conversion\.go$'
        linters: [staticcheck]
        text: '^ST1016: methods on the same type should have the same receiver name \(seen 1x "dst", 2x "src", 3x "in"\)$'
        source: '^[[:space:]]*func \(dst \*ClusterManagementAddOn\) ConvertFrom\(srcRaw conversion\.Hub\) error \{[[:space:]]*$'
      - path: '^pkg/addon/webhook/v1beta1/managedclusteraddon_conversion\.go$'
        linters: [staticcheck]
        text: '^SA1019: src\.Spec\.InstallNamespace is deprecated'
        source: '^[[:space:]]*dst\.ManagedClusterAddOn\.Annotations\[InstallNamespaceAnnotation\] = src\.Spec\.InstallNamespace[[:space:]]*$'
      - path: '^pkg/addon/webhook/v1beta1/managedclusteraddon_conversion\.go$'
        linters: [staticcheck]
