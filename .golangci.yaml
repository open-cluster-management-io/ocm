# Copyright Contributors to the Open Cluster Management project

version: "2"

run:
  concurrency: 10
  timeout: 5m

formatters:
  enable:
    - gci
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - open-cluster-management.io/ocm/
    gci:
      sections:
        - standard
        - default
        - prefix(open-cluster-management.io)
        - localmodule

linters:
  exclusions:
    warn-unused: true
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    paths:
      - ".*_test\\.go"
    rules:
      - linters:
          - staticcheck
        path: _test\.go$|^test/
        source: \. "github\.com/onsi/(gomega|ginkgo)(/v[0-9])?"
  settings:
    errcheck:
      verbose: true
    revive:
      confidence: 0.1
    misspell:
      locale: US
      ignore-rules:
        - cancelled
        - cancelling
    lll:
      line-length: 160
    gocritic:
      # Additions to the stable checks, which are already enabled.
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - commentedOutImport
        - docStub
        - emptyFallthrough
        - equalFold
        - hexLiteral
        - indexAlloc
        - initClause
        - methodExprCall
        - nilValReturn
        - rangeExprCopy
        - stringXbytes
        - typeAssertChain
        - typeUnparen
        - unnecessaryBlock
        - weakCond

issues:
  # Report every finding. Zero disables the limit.
  max-issues-per-linter: 0
  max-same-issues: 0
