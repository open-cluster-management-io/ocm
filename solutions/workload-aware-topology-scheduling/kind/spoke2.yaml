# Spoke with only zone-level topology: no rack labels, so rack-constrained gangs cannot land here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
featureGates:
  GenericWorkload: true
  TopologyAwareWorkloadScheduling: true
  # Lets the Job controller turn a batch/v1 Job's spec.scheduling into a Workload + PodGroup.
  WorkloadWithJob: true
# Workload and PodGroup are served at a beta version that is off by default.
runtimeConfig:
  scheduling.k8s.io/v1beta1: "true"
nodes:
- role: control-plane
- role: worker
  labels: {topology.kubernetes.io/zone: zone-a}
- role: worker
  labels: {topology.kubernetes.io/zone: zone-b}
