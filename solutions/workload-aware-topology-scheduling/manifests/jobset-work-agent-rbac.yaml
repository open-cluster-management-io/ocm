# Applied on each spoke: JobSet's roles do not aggregate into "admin", so the OCM work
# agent needs this to apply JobSets delivered by ManifestWorks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: open-cluster-management:work:jobsets
  labels:
    open-cluster-management.io/aggregate-to-work: "true"
rules:
- apiGroups: ["jobset.x-k8s.io"]
  resources: ["jobsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
