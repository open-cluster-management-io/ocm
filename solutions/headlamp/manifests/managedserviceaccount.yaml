# One ManagedServiceAccount per managed cluster, in that cluster's hub namespace.
# The sync-to-clusterprofile label is what tells the managed-serviceaccount addon
# to copy the token into the ClusterProfile namespace as <cluster>-<name>, which
# is where cp-creds looks for it. Without the label nothing is synced.
#
# deploy.sh generates these for the clusters you pass it; this file is the
# equivalent for a two-cluster fleet if you would rather apply it by hand.
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: headlamp
  namespace: cluster1
  labels:
    authentication.open-cluster-management.io/sync-to-clusterprofile: "true"
spec:
  rotation:
    enabled: true
    validity: 8640h0m0s
---
apiVersion: authentication.open-cluster-management.io/v1beta1
kind: ManagedServiceAccount
metadata:
  name: headlamp
  namespace: cluster2
  labels:
    authentication.open-cluster-management.io/sync-to-clusterprofile: "true"
spec:
  rotation:
    enabled: true
    validity: 8640h0m0s
