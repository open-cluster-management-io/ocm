apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: nginx-default-backend
  namespace: cluster2
spec:
  workload:
    manifests:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nginx-default-backend
          namespace: default
          labels:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: default-backend
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: default-backend
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ingress-nginx
                app.kubernetes.io/component: default-backend
            spec:
              containers:
                - name: default-backend
                  image: registry.k8s.io/defaultbackend-amd64:1.5
                  ports:
                    - containerPort: 8080
                  livenessProbe:
                    httpGet:
                      path: /healthz
                      port: 8080
                    initialDelaySeconds: 30
                    timeoutSeconds: 5
      - apiVersion: v1
        kind: Service
        metadata:
          name: nginx-default-backend
          namespace: default
          labels:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: default-backend
        spec:
          selector:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: default-backend
          ports:
            - port: 80
              targetPort: 8080
