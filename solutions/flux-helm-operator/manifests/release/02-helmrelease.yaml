apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 5m
  # Installed into flux-system (already created by the addon) to keep this
  # demo to a single ManifestWork. Point targetNamespace elsewhere by adding
  # that Namespace object ahead of the HelmRelease in its own, earlier-applied
  # ManifestWork -- see the Notes section in the README.
  targetNamespace: flux-system
  releaseName: podinfo
  chart:
    spec:
      chart: podinfo
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
