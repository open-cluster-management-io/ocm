name: Post

on:
  push:
    paths-ignore:
      - 'solutions/**'
      - 'assets/**'
      - 'troubleshooting/**'
      - ".github/ISSUE_TEMPLATE/*"
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: unit
        run: make test
      - name: report coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_UPLOAD_TOKEN }}
          files: ./coverage.out
          flags: unit
          name: unit
          verbose: true
          fail_ci_if_error: true
  images:
    name: images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
        image-name: [ registration-operator, registration, work, placement, addon-manager ]
    # The Makefile reads IMAGE_REGISTRY, IMAGE_TAG and IMAGE_BUILD_EXTRA_FLAGS from the environment.
    env:
      IMAGE_REGISTRY: quay.io/open-cluster-management
      IMAGE_TAG: latest-${{ matrix.arch }}
      IMAGE_REF: quay.io/open-cluster-management/${{ matrix.image-name }}:latest-${{ matrix.arch }}
      IMAGE_BUILD_EXTRA_FLAGS: --build-arg OS=linux --build-arg ARCH=${{ matrix.arch }}
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The image version comes from `git describe`, which needs the tags and the history
        # back to the last release. A treeless clone has both and stays small.
        with:
          fetch-depth: 0
          filter: tree:0
      - name: install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: install imagebuilder
        run: go install github.com/openshift/imagebuilder/cmd/imagebuilder@v1.2.3
      # imagebuilder has no platform flag: it uses whatever the local tag points to and pulls the
      # runner's amd64 variant if the tag is missing. Pre-pull each Dockerfile's final-stage base
      # image for the target arch. Earlier stages stay native because they cross-compile.
      - name: pull base images
        run: |
          images=$(for file in build/Dockerfile*; do
            awk 'toupper($1) == "FROM" { print $2 }' "${file}" | tail -n 1
          done | sort -u)
          for image in ${images}; do
            docker pull "${image}" --platform=linux/${{ matrix.arch }}
          done
      - name: images
        run: make image-${{ matrix.image-name }}
      - name: verify image architecture
        run: |
          arch=$(docker image inspect --format '{{.Architecture}}' "${IMAGE_REF}")
          if [ "${arch}" != "${{ matrix.arch }}" ]; then
            echo "::error::${IMAGE_REF} was built with architecture ${arch}, expected ${{ matrix.arch }}. Check that every base image in build/Dockerfile.* is pre-pulled for linux/${{ matrix.arch }}."
            exit 1
          fi
      - name: push
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login quay.io --username ${{ secrets.DOCKER_USER }} --password-stdin
          docker push "${IMAGE_REF}"
          image_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REF}" | cut -d'@' -f2)
          echo "IMAGE_DIGEST=${image_digest}" >> $GITHUB_ENV
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
      - name: Attest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        id: attest
        with:
          subject-name: quay.io/open-cluster-management/${{ matrix.image-name }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: 'sbom.spdx.json'
          push-to-registry: false
  image-manifest:
    name: image manifest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image-name: [ registration-operator, registration, work, placement, addon-manager ]
    needs: [ images ]
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Step to install Skopeo
      - name: Install Skopeo and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq
      - name: create
        run: |
          echo ${{ secrets.DOCKER_PASSWORD }} | docker login quay.io --username ${{ secrets.DOCKER_USER }} --password-stdin
          docker manifest create quay.io/open-cluster-management/${{ matrix.image-name }}:latest \
            quay.io/open-cluster-management/${{ matrix.image-name }}:latest-amd64 \
            quay.io/open-cluster-management/${{ matrix.image-name }}:latest-arm64
      - name: annotate
        run: |
          docker manifest annotate quay.io/open-cluster-management/${{ matrix.image-name }}:latest \
            quay.io/open-cluster-management/${{ matrix.image-name }}:latest-amd64 --arch amd64
          docker manifest annotate quay.io/open-cluster-management/${{ matrix.image-name }}:latest \
            quay.io/open-cluster-management/${{ matrix.image-name }}:latest-arm64 --arch arm64
      - name: push
        run: |
          docker manifest push quay.io/open-cluster-management/${{ matrix.image-name }}:latest
          image_digest_latest=$(skopeo inspect docker://quay.io/open-cluster-management/${{ matrix.image-name }}:latest | jq -r '.Digest')
          echo "IMAGE_DIGEST_LATEST=${image_digest_latest}" >> $GITHUB_ENV
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: quay.io/open-cluster-management/${{ matrix.image-name }}:latest
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'
      - name: Attest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        id: attest
        with:
          subject-name: quay.io/open-cluster-management/${{ matrix.image-name }}
          subject-digest: ${{ env.IMAGE_DIGEST_LATEST }}
          sbom-path: 'sbom.spdx.json'
          push-to-registry: false
  trigger-clusteradm-e2e:
    needs: [ images, image-manifest ]
    name: trigger clusteradm e2e
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.OCM_BOT_PAT }}
          repository: open-cluster-management-io/clusteradm
          event-type: ocm_changes
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
