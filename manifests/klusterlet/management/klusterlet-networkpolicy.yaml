apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: klusterlet
  namespace: {{ .AgentNamespace }}
spec:
  podSelector:
    matchLabels:
      app: klusterlet
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  egress:
  - to:
    - podSelector: {}
  - ports:
    - protocol: TCP
      port: 443
